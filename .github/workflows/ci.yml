name: CI

on:
  pull_request:
  push:
    branches: [main]

# Uma execução por branch: push em sequência cancela a anterior em vez de
# enfileirar deploys que já nasceram desatualizados.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # `npm run build` roda `tsc -b` antes do Vite, então isto também typecheca.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Publicar no GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Publicar no Pages via Actions usa o token que o próprio GitHub injeta na
    # execução. Não há secret para criar nem credencial para guardar.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Um deploy por vez, e sem cancelar o que está no ar: interromper uma
    # publicação em curso deixaria o site num estado indefinido.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Reaproveita o dist do job anterior em vez de compilar de novo.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
